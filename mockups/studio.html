<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRAND device mockup</title>
<style>
  html,body{margin:0;height:100%;background:#f3f1eb;}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .scene{perspective:1600px;padding:80px 120px 120px;}
  .phone{
    width:340px;height:694px;position:relative;
    transform:rotateY(-24deg) rotateX(7deg) rotateZ(-2deg);
    transform-style:preserve-3d;
    filter:drop-shadow(28px 60px 50px rgba(0,0,0,.28));
  }
  .btn{position:absolute;background:linear-gradient(180deg,#9a9894,#5a5956);border-radius:2px;}
  .mute{left:-4px;top:118px;width:4px;height:34px;}
  .vol-up{left:-4px;top:168px;width:4px;height:64px;}
  .vol-down{left:-4px;top:244px;width:4px;height:64px;}
  .power{right:-4px;top:214px;width:4px;height:96px;}
  .body{
    width:100%;height:100%;
    background:linear-gradient(155deg,#8a8884 0%,#4a4a4c 16%,#1f1f21 52%,#2c2c2e 100%);
    border-radius:56px;padding:13px;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.35),
      inset 0 -1px 2px rgba(0,0,0,.5);
  }
  .screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#101412;position:relative;}
  .screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
  .island{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:118px;height:34px;background:#050505;border-radius:20px;
  }
  .island::after{
    content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #4a6d90, #0b1218 70%);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="phone">
      <span class="btn mute"></span>
      <span class="btn vol-up"></span>
      <span class="btn vol-down"></span>
      <span class="btn power"></span>
      <div class="body">
        <div class="screen">
          <img src="wash-claire.png" alt="STRAND home screen for Claire">
          <span class="island"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
